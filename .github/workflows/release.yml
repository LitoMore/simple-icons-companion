name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" simple-icons-companion.user.js --clobber
          else
            gh release create "$GITHUB_REF_NAME" simple-icons-companion.user.js --verify-tag --title "$GITHUB_REF_NAME" --notes "Release $GITHUB_REF_NAME"
          fi
